        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaAssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"

  /sites/{siteId}/media/{mediaAssetId}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
      - name: mediaAssetId
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: deleteMediaAsset
      tags: [media]
      summary: Delete a media asset (requires confirmation client-side)
      responses:
        "204":
          description: Deleted

  /sites/{siteId}/footer:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getFooterContent
      tags: [footer-contact]
      summary: Get footer content for a site
      responses:
        "200":
          description: Footer content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FooterContent"
    put:
      operationId: updateFooterContent
      tags: [footer-contact]
      summary: Update footer content for a site (creates a version snapshot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FooterContentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FooterContent"

  /sites/{siteId}/contact:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getContactInfo
      tags: [footer-contact]
      summary: Get contact info for a site
      responses:
        "200":
          description: Contact info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInfo"
    put:
      operationId: updateContactInfo
      tags: [footer-contact]
      summary: Update contact info for a site (creates a version snapshot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInfoInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInfo"

  /sites/{siteId}/square-config:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getSquareConfig
      tags: [square]
