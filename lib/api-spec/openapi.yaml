openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FSTS Client Dashboard Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user
  - name: sites
    description: Client site management
  - name: users
    description: User & RBAC management
  - name: content
    description: Content management (homepage, courses, events, articles)
  - name: seo
    description: SEO settings
  - name: media
    description: Media library
  - name: footer-contact
    description: Footer and contact info
  - name: square
    description: Square payment configuration
  - name: email
    description: Email settings
  - name: versions
    description: Content version history
  - name: activity
    description: Activity log
  - name: backups
    description: Backups
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current authenticated user profile and role assignments
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List all client sites visible to the current user
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a new client site (super admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/{siteId}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a single site
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update site metadata / branding / white-label settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Archive / delete a client site (super admin only, requires confirmation client-side)
      responses:
        "204":
          description: Deleted

  /sites/{siteId}/dashboard-summary:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getSiteDashboardSummary
      tags: [sites]
      summary: Get aggregate counts and recent activity for a site's dashboard home
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all dashboard users and their site role assignments
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardUser"
    post:
      operationId: createUser
      tags: [users]
      summary: Invite / create a dashboard user with a role on one or more sites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUser"

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's role assignments or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUser"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Remove a dashboard user (requires confirmation client-side)
      responses:
        "204":
          description: Deleted

  /sites/{siteId}/homepage:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getHomepageContent
      tags: [content]
      summary: Get the homepage content block for a site
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageContent"
    put:
      operationId: updateHomepageContent
      tags: [content]
      summary: Update the homepage content block for a site (creates a version snapshot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepageContentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageContent"

  /sites/{siteId}/courses:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listCourses
      tags: [content]
      summary: List courses for a site
      responses:
        "200":
          description: List of courses
          content:
            application/json:
