              schema:
                $ref: "#/components/schemas/SquareConfig"
    put:
      operationId: updateSquareConfig
      tags: [square]
      summary: Update Square payment configuration for a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SquareConfigInput"
      responses:
