      summary: Restore a piece of content to a prior version snapshot (requires confirmation client-side)
      responses:
        "200":
          description: Restored version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersion"

  /sites/{siteId}/activity-log:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listActivityLog
      tags: [activity]
      summary: List the activity log for a site
      responses:
        "200":
          description: List of activity log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogEntry"

  /sites/{siteId}/backups:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listBackups
      tags: [backups]
      summary: List backups for a site
      responses:
        "200":
          description: List of backups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
    post:
      operationId: createBackup
      tags: [backups]
      summary: Create a manual backup snapshot of a site's content
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"

  /sites/{siteId}/backups/{backupId}/restore:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
      - name: backupId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: restoreBackup
      tags: [backups]
      summary: Restore a site from a backup snapshot (requires confirmation client-side)
      responses:
        "200":
          description: Restored backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Role:
      type: string
      enum:
        - super_admin
        - client_admin
        - editor
        - marketing
        - training_manager
        - read_only

    SiteRoleAssignment:
      type: object
      required: [siteId, siteName, role]
      properties:
        siteId: { type: integer }
        siteName: { type: string }
        role:
          $ref: "#/components/schemas/Role"

    Me:
      type: object
      required: [id, clerkUserId, name, email, isSuperAdmin, roleAssignments]
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        name: { type: string }
        email: { type: string }
        isSuperAdmin: { type: boolean }
        roleAssignments:
          type: array
          items:
            $ref: "#/components/schemas/SiteRoleAssignment"

    DashboardUser:
      type: object
      required: [id, clerkUserId, name, email, isSuperAdmin, isActive, roleAssignments, createdAt]
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        name: { type: string }
        email: { type: string }
        isSuperAdmin: { type: boolean }
        isActive: { type: boolean }
        roleAssignments:
          type: array
          items:
            $ref: "#/components/schemas/SiteRoleAssignment"
        createdAt: { type: string, format: date-time }

    UserRoleAssignmentInput:
      type: object
      required: [siteId, role]
      properties:
        siteId: { type: integer }
        role:
          $ref: "#/components/schemas/Role"

    UserInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        isSuperAdmin: { type: boolean }
        roleAssignments:
          type: array
          items:
            $ref: "#/components/schemas/UserRoleAssignmentInput"

    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        isSuperAdmin: { type: boolean }
        isActive: { type: boolean }
        roleAssignments:
          type: array
          items:
            $ref: "#/components/schemas/UserRoleAssignmentInput"

    WebsiteType:
      type: string
      enum:
        - business_website
        - ecommerce
        - security_company
        - training_academy
        - church
        - property_management
        - medical
        - legal
        - restaurant
        - membership
        - professional_services
        - construction
        - real_estate
        - manufacturing
        - custom_enterprise

    EnabledModules:
      type: object
      required: [homepage, courses, events, articles, media, contact, footer, seo, payments, email]
      properties:
        homepage: { type: boolean }
        courses: { type: boolean }
        events: { type: boolean }
