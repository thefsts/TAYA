    post:
      operationId: createCourse
      tags: [content]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /sites/{siteId}/courses/{courseId}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getCourse
      tags: [content]
      summary: Get a single course
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    patch:
      operationId: updateCourse
      tags: [content]
      summary: Update a course (creates a version snapshot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [content]
      summary: Delete a course (requires confirmation client-side)
      responses:
        "204":
          description: Deleted

  /sites/{siteId}/events:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listEvents
      tags: [content]
      summary: List events for a site
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [content]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /sites/{siteId}/events/{eventId}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getEvent
      tags: [content]
      summary: Get a single event
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    patch:
      operationId: updateEvent
      tags: [content]
      summary: Update an event (creates a version snapshot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [content]
      summary: Delete an event (requires confirmation client-side)
      responses:
        "204":
          description: Deleted

  /sites/{siteId}/articles:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listArticles
      tags: [content]
      summary: List articles / blog posts for a site
      responses:
