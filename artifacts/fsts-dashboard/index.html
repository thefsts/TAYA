      {"@context":"https://schema.org","@type":"SoftwareApplication","name":"TAYA","applicationCategory":"BusinessApplication","operatingSystem":"Web","description":"Secure website operations and client management platform by Full Stack Tech & Solutions LLC.","creator":{"@type":"Organization","name":"Full Stack Tech & Solutions LLC"}}

  <body>
    <div id="root"></div>
    <script>
      // Client account controls stay inside TAYA. Clerk remains the auth
      // provider, but its hosted Account Portal is not part of the product UX.
      document.addEventListener("click", async function (event) {
        const target = event.target instanceof Element ? event.target.closest("a") : null;
        if (!target) return;

        let url;
        try {
          url = new URL(target.href, window.location.origin);
        } catch {
          return;
        }

        if (url.hostname !== "accounts.app.fstsclientsystem.com") return;

        event.preventDefault();
        event.stopPropagation();

        if (url.pathname.startsWith("/user/logout")) {
          try {
            const clerk = window.Clerk;
            if (clerk && typeof clerk.signOut === "function") {
              await clerk.signOut({ redirectUrl: "/sign-in" });
              return;
            }
          } catch (error) {
            console.error("TAYA sign-out failed", error);
          }
          window.location.assign("/sign-in");
          return;
        }

        const siteMatch = window.location.pathname.match(/^\/app\/sites\/([^/]+)/);
        if (siteMatch) {
          window.location.assign(`/app/sites/${encodeURIComponent(siteMatch[1])}/permissions?tab=account`);
          return;
        }

        window.location.assign("/app");
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
