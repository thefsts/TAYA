name: Chat 2 Lockfile Refresh

on:
  push:
    branches:
      - chat2-replit-cleanup

permissions:
  contents: write

jobs:
  refresh-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chat2-replit-cleanup
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Remove obsolete Replit workspace policy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'pnpm-workspace.yaml';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace('packages released by trusted organizations with an impeccable security\n# posture (e.g. Replit packsges, react from Meta, typescript from Microsoft). Even then,', 'packages released by trusted organizations with an impeccable security\n# posture. Even then,');
          s = s.replace(/  # Exclude @replit scoped packages from the minimum release age check\.\n  # These are published by Replit and trusted[^\n]*\n  # this setting guards against does not apply to our own packages\.\n  - '@replit\/\*'\n  - stripe-replit-sync\n/, '');
          s = s.replace(/  '@replit\/vite-plugin-cartographer': \^0\.5\.1\n/, '');
          s = s.replace(/  '@replit\/vite-plugin-dev-banner': \^0\.1\.1\n/, '');
          s = s.replace(/  '@replit\/vite-plugin-runtime-error-modal': \^0\.0\.6\n/, '');
          s = s.replace('  # replit uses linux-x64 only, we can exclude all other platforms', '  # Production builds target Linux x64; exclude unused platform binaries to keep installs deterministic');
          fs.writeFileSync(path, s);
          NODE

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify no active Replit package declarations
        shell: bash
        run: |
          if grep -RInE '@replit/|stripe-replit-sync' artifacts/fsts-dashboard/package.json artifacts/mockup-sandbox/package.json pnpm-workspace.yaml pnpm-lock.yaml; then
            echo 'Active Replit package reference remains in package/workspace/lockfile state.'
            exit 1
          fi

      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: Validate catalog
        run: pnpm run validate:catalog

      - name: Commit synchronized workspace and lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-workspace.yaml pnpm-lock.yaml; then
            echo 'Workspace and lockfile already synchronized.'
          else
            git config user.name 'Full Stack Tech Solutions'
            git config user.email 'amorebey@gmail.com'
            git add pnpm-workspace.yaml pnpm-lock.yaml
            git commit -m 'Synchronize pnpm state after Replit cleanup [skip ci]'
            git push origin HEAD:chat2-replit-cleanup
          fi

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm run typecheck

      - name: Convex unit tests
        id: convex_tests
        continue-on-error: true
        run: pnpm run test:convex-unit

      - name: Design Lock tests
        id: design_lock
        continue-on-error: true
        run: pnpm run test:design-lock

      - name: Production build
        id: build
        continue-on-error: true
        run: pnpm run build

      - name: Report certification blockers
        shell: bash
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "convex_tests=${{ steps.convex_tests.outcome }}"
          echo "design_lock=${{ steps.design_lock.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.convex_tests.outcome }}" != "success" ] || [ "${{ steps.design_lock.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi
