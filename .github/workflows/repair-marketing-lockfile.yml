name: Repair marketing lockfile

on:
  push:
    branches:
      - repair/marketing-lockfile

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit repaired lockfile to main
        run: |
          git config user.name "THEFSTS"
          git config user.email "amorebey@gmail.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "fix(taya-marketing): sync pnpm lockfile"
          git push origin HEAD:main
