name: Commit Identity Audit

# Runs on every push to main and on every pull request targeting main.
# Catches identity violations in the incoming commits (pre-merge and
# post-merge guard) so bad identities can't silently accumulate.
#
# Design note: full-history audit (origin/main) is intentionally not run
# here because pre-existing Replit Agent commits in origin/main would make
# the check fail unconditionally.  post-merge.sh enforces THEFSTS authorship
# at merge time for all outgoing commits; this workflow audits the delta that
# each push or PR introduces.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  identity-audit:
    name: Author identity check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Full history is required so git can resolve before/after SHAs.
          fetch-depth: 0

      - name: Run push-delta identity audit (push to main)
        if: github.event_name == 'push'
        # Audit only the commits introduced by this push.
        # github.event.before is the SHA before the push; github.sha is the tip.
        # Falls back to HEAD~1..HEAD for the very first push (before == 000…).
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          echo "Auditing push-delta commits (${BEFORE}..${AFTER}) for authorized author identity…"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${BEFORE}..${AFTER}"
          fi
          bash scripts/check-commit-identity.sh "$RANGE"

      - name: Run PR-range identity audit (pull request)
        if: github.event_name == 'pull_request'
        # For a PR, only the incoming commits (base..head) need checking;
        # the base branch is presumed clean by the push job above.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Auditing PR commits ($BASE_SHA..$HEAD_SHA) for authorized author identity…"
          bash scripts/check-commit-identity.sh "${BASE_SHA}..${HEAD_SHA}"
