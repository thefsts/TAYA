name: Deploy TAYA QA Candidate Backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-taya-qa-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taya-qa-candidate-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact certified candidate
        uses: actions/checkout@v4
        with:
          ref: 844506d4e547c0ac758708c157f7e24ca91bb48e
          fetch-depth: 0

      - name: Verify exact candidate and PR 61 head
        run: |
          set -eu
          EXPECTED="844506d4e547c0ac758708c157f7e24ca91bb48e"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          git fetch origin pull/61/head:refs/remotes/pr61/head --quiet
          PR_HEAD="$(git rev-parse refs/remotes/pr61/head)"
          test "$PR_HEAD" = "$EXPECTED"
          echo "PASS: exact certified PR #61 head verified."

      - name: Verify production Convex target
        run: |
          set -eu
          EXPECTED_URL="https://uncommon-cobra-336.convex.cloud"
          ACTUAL_URL="$(node -e "console.log(require('./convex.json').prodUrl)")"
          test "$ACTUAL_URL" = "$EXPECTED_URL"
          echo "PASS: production target is uncommon-cobra-336."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deploy key targets production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -eu
          case "$CONVEX_DEPLOY_KEY" in
            prod:uncommon-cobra-336\|*)
              echo "PASS: deploy key targets production uncommon-cobra-336."
              ;;
            *)
              echo "FAIL: production Convex deploy key missing or targets the wrong deployment." >&2
              exit 1
              ;;
          esac

      - name: Deploy exact candidate backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bash scripts/deploy-convex.sh

      - name: Verify production backend responds
        run: |
          set -eu
          BODY='{"path":"health:ping","args":{},"format":"json"}'
          RESPONSE="$(curl --fail --silent --show-error \
            -X POST "https://uncommon-cobra-336.convex.cloud/api/query" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          echo "$RESPONSE" | grep -q '"status":"success"'
          echo "$RESPONSE" | grep -q '"status":"ok"'
          echo "PASS: production Convex health:ping returned success."
